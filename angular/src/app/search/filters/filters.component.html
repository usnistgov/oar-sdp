<div
  [@filterExpand]="
    mobileMode ? 'expanded' : isActive ? 'expanded' : 'collapsed'
  "
  [ngStyle]="{ width: mobileMode ? '100%' : filterWidthNum + 'px' }"
  [ngClass]="{
    'filters-collapsed-root': !isActive && !mobileMode,
    'mobile-filters-collapsed': mobileMode && !isActive
  }"
  style="background-color: white; position: relative; overflow: hidden"
>
  <!-- Full filter body (hidden when collapsed on mobile & desktop) -->
  <div
    class="normalFilter"
    [hidden]="!isActive"
    id="activeFilter"
    style="height: auto; padding-bottom: 1em"
  >
    <div style="padding: 0px">
      <!-- Filter header -->
      <div id="filterHeader" *ngIf="!mobileMode && isActive">
        <a
          *ngIf="!mobileMode"
          id="filtersLabel"
          class="btn-sm collapsed in"
          (click)="setFilterWidth()"
          data-toggle="collapse"
          style="
            border-color: #025277;
            color: #fff;
            padding: 0em;
            border: 0em;
            cursor: pointer;
          "
          data-target="#demo"
          ><span *ngIf="filterWidthNum > 170">Filters </span
          ><i
            [ngClass]="getFilterImgClass()"
            style="zoom: 100%; color: #fff; cursor: pointer"
          ></i
        ></a>

        <a
          *ngIf="!mobileMode"
          href="#"
          id="clear-all"
          data-toggle="tooltip"
          title="Clear all filters"
          (click)="$event.preventDefault(); clearFilters()"
        >
          <i
            style="vertical-align: middle; zoom: 70%; margin-right: 0.3em"
            class="faa faa-remove"
          >
          </i
          ><span *ngIf="filterWidthNum > 170">Clear All</span></a
        >
      </div>

      <!-- Filter body -->
      <!-- Display spinner while waiting for search result -->
      <div class="spinner" *ngIf="searching">
        <i
          class="faa faa-spinner faa-spin faa-stack-2x"
          style="color: #1e6ba1"
          aria-hidden="true"
        ></i>
      </div>

      <div
        *ngIf="
          isActive &&
          !searching &&
          !recordHasLoading &&
          !themeLoading &&
          !resourceTypeLoading
        "
      >
        <!-- NIST Research topics with skeleton -->
        <div
          class="bottom-line compact-filter topics-block"
          [class.topics-block--with-show-more]="showMoreLink && !themeLoading"
        >
          <ng-container *ngIf="!themeLoading; else themeSkeleton">
            <div class="facet-cards">
              <!-- Section header -->
              <div class="facet-cards__header">
                <i class="pi pi-tags facet-cards__header-icon" aria-hidden="true"></i>
                <span class="facet-cards__title">Research Topics</span>
              </div>

              <!-- Clickable topic cards (3 per row on desktop, responsive down to 1) -->
              <div *ngIf="themesWithCount.length > 0; else topicsEmpty" class="facet-card-grid">
                <button
                  type="button"
                  class="facet-card"
                  *ngFor="let node of visibleTopics; trackBy: trackFacet"
                  [class.selected]="isFacetSelected(node, selectedThemesNode)"
                  [attr.aria-pressed]="isFacetSelected(node, selectedThemesNode)"
                  [title]="node.data"
                  (click)="toggleFacet(node, selectedThemesNode)"
                >
                  <i class="pi facet-card__icon" [ngClass]="topicIcon(node.data)" aria-hidden="true"></i>
                  <span class="facet-card__name">{{ node.data }}</span>
                  <span class="facet-card__count">{{ facetCount(node) }}</span>
                  <i class="pi pi-check-circle facet-card__check" aria-hidden="true"></i>
                </button>
              </div>
              <ng-template #topicsEmpty>
                <div class="facet-empty" role="status">
                  <i class="pi pi-inbox facet-empty__icon" aria-hidden="true"></i>
                  <span class="facet-empty__text">No research topics match the current products and filters.</span>
                </div>
              </ng-template>
            </div>
          </ng-container>
          <ng-template #themeSkeleton>
            <div class="facet-skeleton-group">
              <div class="facet-skel header"></div>
              <div class="facet-skel line w50"></div>
              <div class="facet-skel line w40"></div>
              <div class="facet-skel line w30"></div>
            </div>
          </ng-template>
          <!-- Show More / Show Less button — straddles the divider line below -->
          <div *ngIf="showMoreLink && !themeLoading" class="topics-show-more-wrap">
            <button class="topics-show-more-btn" (click)="toggleTopicsExpanded()">
              <i class="pi" [ngClass]="topicsExpanded ? 'pi-chevron-up' : 'pi-chevron-down'"></i>
              {{ topicsExpanded ? 'Show Less' : 'Show More' }}
            </button>
          </div>
        </div>
      </div>

      <div style="width: 100%">
        <div>
          <!-- Resource type with skeleton -->
          <div class="bottom-line compact-filter">
            <ng-container
              *ngIf="!resourceTypeLoading; else resourceTypeSkeleton"
            >
              <div class="facet-cards">
                <div class="facet-cards__header">
                  <i class="pi pi-folder-open facet-cards__header-icon" aria-hidden="true"></i>
                  <span class="facet-cards__title">Type of Resource</span>
                </div>
                <div *ngIf="resourceTypesWithCount.length > 0; else resourceTypeEmpty" class="facet-card-grid">
                  <button
                    type="button"
                    class="facet-card"
                    *ngFor="let node of resourceTypesWithCount; trackBy: trackFacet"
                    [class.selected]="isFacetSelected(node, selectedResourceTypeNode)"
                    [attr.aria-pressed]="isFacetSelected(node, selectedResourceTypeNode)"
                    [title]="node.data"
                    (click)="toggleFacet(node, selectedResourceTypeNode)"
                  >
                    <i class="pi facet-card__icon" [ngClass]="resourceTypeIcon(node.data)" aria-hidden="true"></i>
                    <span class="facet-card__name">{{ node.data }}</span>
                    <span class="facet-card__count">{{ facetCount(node) }}</span>
                    <i class="pi pi-check-circle facet-card__check" aria-hidden="true"></i>
                  </button>
                </div>
                <ng-template #resourceTypeEmpty>
                  <div class="facet-empty" role="status">
                    <i class="pi pi-inbox facet-empty__icon" aria-hidden="true"></i>
                    <span class="facet-empty__text">No resource types match the current products and filters.</span>
                  </div>
                </ng-template>
              </div>
            </ng-container>
            <ng-template #resourceTypeSkeleton>
              <div class="facet-skeleton-group">
                <div class="facet-skel header"></div>
                <div class="facet-skel line w40"></div>
                <div class="facet-skel line w30"></div>
              </div>
            </ng-template>
          </div>

          <!-- Components (Record Has) with skeleton -->
          <div class="compact-filter">
            <div class="bottom-line compact-filter">
              <ng-container
                *ngIf="
                  !recordHasLoading && componentsTree.length > 0;
                  else recordHasSkeleton
                "
              >
                <div class="facet-cards">
                  <div class="facet-cards__header">
                    <i class="pi pi-list facet-cards__header-icon" aria-hidden="true"></i>
                    <span class="facet-cards__title">Record Has</span>
                  </div>
                  <div class="facet-card-grid">
                    <button
                      type="button"
                      class="facet-card"
                      *ngFor="let node of componentsWithCount; trackBy: trackFacet"
                      [class.selected]="isFacetSelected(node, selectedComponentsNode)"
                      [attr.aria-pressed]="isFacetSelected(node, selectedComponentsNode)"
                      [title]="node.data"
                      (click)="toggleFacet(node, selectedComponentsNode)"
                    >
                      <i class="pi facet-card__icon" [ngClass]="componentIcon(node.data)" aria-hidden="true"></i>
                      <span class="facet-card__name">{{ node.data }}</span>
                      <span class="facet-card__count">{{ facetCount(node) }}</span>
                      <i class="pi pi-check-circle facet-card__check" aria-hidden="true"></i>
                    </button>
                  </div>
                </div>
              </ng-container>
              <ng-template #recordHasSkeleton>
                <div class="facet-skeleton-group">
                  <div class="facet-skel header"></div>
                  <div class="facet-skel line w50"></div>
                  <div class="facet-skel line w40"></div>
                  <div class="facet-skel line w30"></div>
                </div>
              </ng-template>
            </div>
          </div>
        </div>

        <!-- Authors and Contributors (with skeleton) -->
        <div class="filter-field-block bottom-line">
          <ng-container *ngIf="authorsReady; else authorsSkeleton">
            <div class="filter-field-header">
              <i class="pi pi-users facet-cards__header-icon" aria-hidden="true"></i>
              <span class="facet-cards__title">Authors and Contributors</span>
            </div>
            <div class="filter-input p-fluid">
              <p-autoComplete
                [appendTo]="!mobileMode ? 'body' : null"
                [autoZIndex]="true"
                [baseZIndex]="12000"
                [scrollHeight]="'260px'"
                [(ngModel)]="selectedAuthor"
                inputId="suggestedauthor"
                [suggestions]="suggestedAuthors"
                (completeMethod)="filterAuthors($event)"
                (onSelect)="filterResults()"
                (onUnselect)="filterResults()"
                [multiple]="true"
                [minLength]="1"
                [maxlength]="30"
                [inputStyle]="{ width: '100%', color: 'black' }"
              >
                <ng-template let-author pTemplate="item">
                  <div style="margin-left: 40px">{{ author }}</div>
                </ng-template>
                <ng-template pTemplate="empty">
                  <div class="ac-empty" style="margin-left: 40px">
                    No authors found
                  </div>
                </ng-template>
              </p-autoComplete>
            </div>
          </ng-container>
          <ng-template #authorsSkeleton>
            <div
              class="facet-skeleton-group"
              style="margin-left: 2em; margin-top: 1em"
            >
              <div class="facet-skel header" style="width: 40%"></div>
              <div class="facet-skel line w50"></div>
              <div class="facet-skel line w30"></div>
            </div>
          </ng-template>
        </div>

        <!-- Keywords (with skeleton) -->
        <div class="filter-field-block filter-field-block--last">
          <ng-container *ngIf="!themeLoading; else keywordSkeleton">
            <div class="filter-field-header">
              <i class="pi pi-key facet-cards__header-icon" aria-hidden="true"></i>
              <span class="facet-cards__title">Keyword</span>
            </div>
            <div class="filter-input p-fluid">
              <p-autoComplete
                [appendTo]="!mobileMode ? 'body' : null"
                [autoZIndex]="true"
                [baseZIndex]="12000"
                [scrollHeight]="'260px'"
                inputId="keyword"
                [(ngModel)]="selectedKeywords"
                [suggestions]="suggestedKeywords"
                (completeMethod)="updateSuggestedKeywords($event)"
                [multiple]="true"
                (onSelect)="filterResults()"
                (onUnselect)="filterResults()"
                [minLength]="3"
                [maxlength]="30"
                [style]="filterStyle"
                [inputStyle]="{ width: '100%', color: 'black' }"
              >
                <ng-template let-keyword pTemplate="item">
                  <div
                    data-toggle="tooltip"
                    [title]="suggestedKeywordsLkup[keyword]"
                    style="margin-left: 40px"
                  >
                    {{ keyword }}
                  </div>
                </ng-template>
                <ng-template pTemplate="empty">
                  <div class="ac-empty" style="margin-left: 40px">
                    No keywords found
                  </div>
                </ng-template>
              </p-autoComplete>
            </div>
          </ng-container>
          <ng-template #keywordSkeleton>
            <div
              class="facet-skeleton-group"
              style="margin-left: 2em; margin-top: 1em"
            >
              <div class="facet-skel header" style="width: 35%"></div>
              <div class="facet-skel line w50"></div>
              <div class="facet-skel line w40"></div>
              <div class="facet-skel line w30"></div>
            </div>
          </ng-template>
        </div>
      </div>
      <!-- /width:100% wrapper -->


    </div>
    <!-- /padding wrapper -->
  </div>
  <!-- /normalFilter -->

  <!-- Collapsed filters (desktop rotated bar) -->
  <div
    *ngIf="!searching && !isActive && !mobileMode"
    class="collapsedFilterBox"
    (click)="setFilterWidth()"
    aria-label="Expand filters"
    role="button"
    tabindex="0"
    (keyup.enter)="setFilterWidth()"
  >
    <div>
      <i
        class="faa faa-angle-double-right collapsedFilterIcon"
        aria-hidden="true"
      ></i>
    </div>
    <div class="rotate rotatedFilterText">Filters</div>
  </div>

  <!-- Mobile collapsed header toggle (outside normalFilter so it stays visible) -->
  <div
    *ngIf="mobileMode && !isActive"
    class="mobile-collapsed-filter-header"
    (click)="setFilterWidth()"
    role="button"
    aria-label="Expand filters"
    tabindex="0"
    (keyup.enter)="setFilterWidth()"
  >
    <span class="label">Filters</span>
    <i class="faa faa-angle-double-down" aria-hidden="true"></i>
  </div>

</div>
<!-- /root filterExpand container -->
